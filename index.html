:root{--red:#E53935;--yellow:#FDD835;--green:#43A047;--blue:#1E88E5;--ink:#2d2a4a;--bg:#FFF8EC;--u:#7E57C2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:Nunito,system-ui,sans-serif;color:var(--ink);touch-action:manipulation;overscroll-behavior:none}
svg{display:block}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.05);min-height:66px;z-index:5}
.top h1{font-family:Fredoka;font-weight:600;font-size:26px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-family:Fredoka;font-weight:600;border:none;border-radius:18px;padding:10px 18px;font-size:22px;cursor:pointer;background:#F1EDF7;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.14);line-height:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.big{font-size:32px;padding:18px 34px;border-radius:26px}
.btn.go{background:#FFCA28}
.btn.alt{background:#81D4FA}
.icon{width:50px;height:50px;padding:0;display:grid;place-items:center;font-size:26px}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:16px;height:16px;border-radius:50%;background:#E6E1EF;display:block;transition:.3s}
.dots i.on{background:#FFC107;box-shadow:0 0 0 3px #FFE082}
#stage{position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}

/* home */
.home{align-items:center;justify-content:center;gap:1.8vh;background:radial-gradient(circle at 50% 120%,#BBDEFB,#FFF8EC 65%)}
.title{font-family:Fredoka;font-weight:700;font-size:min(7vw,10vh);line-height:1;margin:0;letter-spacing:1px;text-align:center}
.title span:nth-child(1){color:var(--blue)}.title span:nth-child(2){color:var(--red)}.title span:nth-child(3){color:var(--green)}
.sub{font-family:Fredoka;font-size:min(2.6vw,3.6vh);opacity:.75;margin:0}
.units{display:grid;grid-template-columns:repeat(5,1fr);gap:1.6vh 1.8vw;padding:0 3vw;width:100%;max-width:1250px}
.ucard{min-width:0;background:#fff;border-radius:26px;padding:1.2vh 1vw 1.4vh;text-align:center;cursor:pointer;box-shadow:0 8px 0 var(--c),0 10px 24px rgba(0,0,0,.1);border:5px solid var(--c);transition:transform .15s}
.ucard:active{transform:translateY(5px)}
.ucard .tag{display:inline-block;background:var(--c);color:#fff;font-family:Fredoka;font-weight:600;border-radius:99px;padding:4px 16px;font-size:min(2.2vw,3vh)}
.ucard h2{font-family:Fredoka;font-weight:600;margin:.6vh 0 .3vh;font-size:min(1.8vw,2.6vh);line-height:1.1}
.ucard .art{height:min(9vw,12.5vh);display:grid;place-items:center}
.ucard .art svg{height:100%;width:auto}
.ucard .st{font-size:min(2.4vw,3.2vh);font-family:Fredoka;opacity:.8}
.mascot-home{position:absolute;right:3vw;top:2vh;width:min(7vw,11vh);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}

/* unit menu */
.menu{padding:2vh 3vw;gap:2vh;background:linear-gradient(#fff0,#fff0),var(--bg)}
.menu .head{display:flex;align-items:center;gap:16px}
.menu .head h2{font-family:Fredoka;font-size:min(4vw,5.5vh);margin:0;color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(24vw,250px),1fr));gap:2.2vw;flex:1;align-content:center}
.acard{background:#fff;border-radius:26px;border:4px solid var(--c);box-shadow:0 7px 0 var(--c);padding:1.6vh 1vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;cursor:pointer;position:relative;text-align:center}
.acard:active{transform:translateY(4px);box-shadow:0 3px 0 var(--c)}
.acard .les{font-family:Fredoka;font-size:min(1.8vw,2.6vh);background:var(--c);color:#fff;border-radius:99px;padding:3px 12px}
.acard .art{height:min(13vw,19vh);width:100%;display:grid;place-items:center}
.acard .art svg{height:100%;width:auto;max-width:100%}
.acard h3{font-family:Fredoka;font-weight:600;margin:0;font-size:min(2.6vw,3.8vh)}
.acard .bk{font-size:min(1.6vw,2.3vh);opacity:.65;font-weight:700}
.acard .done{position:absolute;top:-14px;right:-10px;width:48px;height:48px}

/* activity */
.act{padding:1.4vh 2vw 2vh;gap:1.4vh}
.prompt{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:8px 16px 8px 8px;box-shadow:0 4px 0 rgba(0,0,0,.07);min-height:72px}
.prompt .drip{width:58px;flex:none}
.prompt .txt{font-family:Fredoka;font-weight:600;font-size:min(3.3vw,4.8vh);flex:1;line-height:1.15}
.cw{padding:0 .1em;-webkit-text-stroke:0}
.cw.yellow{color:#F9A825;text-shadow:0 1px 0 #8a6d00}
.cw.red{color:var(--red)}.cw.green{color:var(--green)}.cw.blue{color:var(--blue)}
.area{flex:1;position:relative;display:flex;gap:2vw;align-items:stretch;justify-content:center;min-height:0}
.panel{background:#fff;border-radius:28px;box-shadow:0 5px 0 rgba(0,0,0,.07);position:relative;display:flex;align-items:center;justify-content:center;min-height:0}

.pots{display:flex;flex-direction:column;gap:1.6vh;justify-content:center}
.pot{width:min(10vw,13vh);height:min(10vw,13vh);border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 3px #d9d3e6,0 6px 0 rgba(0,0,0,.15);cursor:pointer;position:relative;transition:transform .15s}
.pot.sel{transform:scale(1.15);box-shadow:0 0 0 6px #2d2a4a,0 6px 0 rgba(0,0,0,.15)}
.pot.sponge{background:#FFE082;border-radius:22px;border-color:#FFF3C4}
.piece{cursor:grab;touch-action:none}
.piece.sel{filter:drop-shadow(0 0 0 #000) drop-shadow(0 0 8px #FFB300);transform:scale(1.1)}
.piece.dragging{z-index:50;transition:none!important;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3));cursor:grabbing}
.piece.used{opacity:0;pointer-events:none;transform:scale(.4);transition:.3s}
.tray{display:flex;gap:2vw;justify-content:center;align-items:center;background:#FFF3D6;border-radius:24px;padding:1.2vh 2vw;border:3px dashed #E8C27A}
.sticker{background:#fff;border-radius:20px;padding:8px;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .2s,opacity .3s;position:relative}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hl{outline:6px solid #FFC107;outline-offset:4px;border-radius:24px}

.numbtn{background:#fff;border:5px solid #D1C4E9;border-radius:24px;width:min(13vw,17vh);height:min(15vw,20vh);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 0 #D1C4E9}
.numbtn b{font-family:Fredoka;font-size:min(8vw,10vh);line-height:1}
.numbtn .d{display:flex;gap:5px}.numbtn .d i{width:12px;height:12px;border-radius:50%;background:#7E57C2;display:block}
.numbtn:active{transform:translateY(4px)}
.numbtn.ok{border-color:#66BB6A;box-shadow:0 6px 0 #66BB6A;background:#E8F5E9}

.choice{cursor:pointer;transition:transform .15s}
.choice:active{transform:scale(.95)}
.lbl{font-family:Fredoka;font-weight:600;font-size:min(2.4vw,3.4vh);text-align:center}

/* rain */
.rainy{background:linear-gradient(#90A4AE,#CFD8DC 70%,#A5D6A7 70%)}
.sunny{background:linear-gradient(#81D4FA,#E1F5FE 70%,#AED581 70%)}
.drop{position:absolute;width:5px;height:22px;border-radius:4px;background:#E3F2FD;opacity:.9;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(var(--h,400px));opacity:.2}}
.rainlines{position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(105deg,transparent 0 22px,rgba(255,255,255,.55) 22px 24px,transparent 24px 60px);background-size:120px 120px;animation:rain .5s linear infinite;opacity:.6;border-radius:inherit}
@keyframes rain{to{background-position:-30px 120px}}

.bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#B3E5FC 60%,#81D4FA);opacity:.9;pointer-events:none;animation:bub 1.2s ease-out forwards}
@keyframes bub{from{transform:scale(.2)}to{transform:translateY(-80px) scale(1.2);opacity:0}}
.spark{position:absolute;pointer-events:none;font-size:42px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:scale(.3);opacity:1}to{transform:scale(1.6) translateY(-30px);opacity:0}}

/* overlays */
.overlay{position:absolute;inset:0;background:rgba(45,42,74,.55);display:flex;align-items:center;justify-content:center;z-index:60}
.card{background:#fff;border-radius:34px;padding:4vh 5vw;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.15);animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.card h2{font-family:Fredoka;font-size:min(6vw,8vh);margin:1vh 0}
.card .row{display:flex;gap:16px;justify-content:center;margin-top:2vh;flex-wrap:wrap}
.confetti{position:absolute;width:14px;height:20px;top:-30px;animation:conf linear forwards;z-index:70;pointer-events:none}
@keyframes conf{to{transform:translateY(110vh) rotate(720deg)}}
.startcard p{font-size:min(2.4vw,3.4vh);margin:.5vh 0 0}
.fly{position:fixed;z-index:80;pointer-events:none;transition:all .6s cubic-bezier(.5,0,.3,1)}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="btn icon" id="homeBtn" aria-label="Home">🏠</button>
    <button class="btn icon" id="backBtn" aria-label="Back" style="display:none">⬅️</button>
    <h1 id="ttl">PreK Fun Book!</h1>
    <div class="dots" id="dots"></div>
    <button class="btn icon" id="sayBtn" aria-label="Hear it again">🔊</button>
  </div>
  <div id="stage"></div>
</div>
<script>
"use strict";
/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const stage=$('#stage');
const COL={red:'#E53935',yellow:'#FDD835',green:'#43A047',blue:'#1E88E5'};
const COLS=['red','yellow','green','blue'];
const NUMW=['zero','one','two','three','four','five'];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cw=c=>`<span class="cw ${c}">${c}</span>`;
const el=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
let RUN=0; // cancels timers when leaving an activity
function later(fn,ms){const id=RUN;setTimeout(()=>{if(id===RUN)fn()},ms)}

/* ================= sound ================= */
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function tone(f,d,type='sine',vol=.18,when=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+when;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d=.4,freq=1200,vol=.25){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=.8;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const sfx={
 good(){tone(660,.15,'triangle');tone(880,.18,'triangle',.18,.11);tone(1320,.3,'triangle',.14,.22)},
 bad(){tone(240,.22,'square',.06);tone(190,.3,'square',.06,.14)},
 pop(){tone(520,.07,'square',.08);tone(980,.08,'sine',.12,.03)},
 tap(){tone(760,.06,'sine',.12)},
 paint(){noise(.25,2400,.18)},
 splash(){noise(.5,800,.3);tone(300,.2,'sine',.1)},
 win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.32,'triangle',.16,i*.12))}
};

/* ================= voice ================= */
let VOICE=null, LAST='';
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/female|serena|kate|martha|stephanie|libby|sonia|uk english female/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t,onend){LAST=t;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-GB';u.rate=.82;u.pitch=1.12;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){if(onend)setTimeout(onend,800)}}
$('#sayBtn').onclick=()=>{if(PROMPT_SPOKEN)say(PROMPT_SPOKEN)};

/* ================= save ================= */
let SAVE={};try{SAVE=JSON.parse(localStorage.getItem('splashSmile_v1')||'{}')}catch(e){SAVE={}}
function markDone(id){SAVE[id]=1;try{localStorage.setItem('splashSmile_v1',JSON.stringify(SAVE))}catch(e){}}

/* ================= art ================= */
const STROKE='stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
function starPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
function starSVG(fill='#FFC107',sz=40){return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}"><polygon points="${starPts(50,52,46,20)}" fill="${fill}" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/></svg>`}
function dripSVG(){return `<svg viewBox="0 0 100 120"><path d="M50 4C50 4 12 52 12 78a38 38 0 0 0 76 0C88 52 50 4 50 4Z" fill="#4FC3F7" stroke="#0277BD" stroke-width="4"/><ellipse cx="34" cy="56" rx="7" ry="12" fill="#fff" opacity=".55"/><circle cx="38" cy="80" r="6" fill="#1a1a2e"/><circle cx="62" cy="80" r="6" fill="#1a1a2e"/><circle cx="40" cy="78" r="2" fill="#fff"/><circle cx="64" cy="78" r="2" fill="#fff"/><path d="M40 94 Q50 104 60 94" fill="none" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/><circle cx="28" cy="92" r="6" fill="#F48FB1" opacity=".7"/><circle cx="72" cy="92" r="6" fill="#F48FB1" opacity=".7"/></svg>`}
function bootShape(x,col,dir){ // dir -1 toe left, 1 toe right ; boot occupies ~ x..x+30, toe extends 16
  const d=dir<0?`M${x+30} 0 V54 H${x-12} Q${x-17} 54 ${x-17} 48 Q${x-17} 36 ${x} 36 V0 Z`:`M${x} 0 V54 H${x+42} Q${x+47} 54 ${x+47} 48 Q${x+47} 36 ${x+30} 36 V0 Z`;
  return `<path d="${d}" fill="${col}" ${STROKE}/><rect x="${dir<0?x-17:x}" y="50" width="47" height="8" rx="4" fill="#5D4037"/><rect x="${x}" y="0" width="30" height="9" fill="rgba(0,0,0,.18)"/><path d="M${x+8} 15 V30" stroke="rgba(255,255,255,.65)" stroke-width="5" stroke-linecap="round"/>`}
function bootsSVG(col){return `<svg viewBox="-2 -4 136 68">${bootShape(20,COL[col]||col,-1)}${bootShape(84,COL[col]||col,1)}</svg>`}

function kidSVG(o){ // {girl, coat, boots, drop}
  const skin=o.girl?'#F9D4BC':'#C68A5C',hair=o.girl?'#F6C343':'#2E2320',coat=COL[o.coat]||o.coat;
  let s=`<svg viewBox="0 0 200 340" class="kid">`;
  s+=`<ellipse cx="100" cy="320" rx="90" ry="16" fill="#90CAF9" opacity=".85"/>`;
  const sock=(x)=>{let t=`<rect x="${x}" y="226" width="24" height="80" rx="8" fill="#fff" ${STROKE}/>`;if(o.girl){for(let y=240;y<300;y+=12)t+=`<rect x="${x+2}" y="${y}" width="20" height="5" fill="#64B5F6"/>`}else t+=`<rect x="${x+1.5}" y="228" width="21" height="10" fill="#E53935"/>`;t+=`<ellipse cx="${x+12}" cy="306" rx="16" ry="9" fill="#fff" ${STROKE}/>`;return t};
  s+=sock(70)+sock(106);
  if(o.boots){const bc=COL[o.boots];s+=`<g transform="translate(0,256)">${bootShape(67,bc,-1)}${bootShape(103,bc,1)}</g>`}
  if(o.girl)s+=`<ellipse cx="44" cy="118" rx="15" ry="24" fill="${hair}" ${STROKE}/><ellipse cx="156" cy="118" rx="15" ry="24" fill="${hair}" ${STROKE}/><circle cx="52" cy="100" r="7" fill="#EC407A" ${STROKE}/><circle cx="148" cy="100" r="7" fill="#EC407A" ${STROKE}/>`;
  s+=`<path d="M66 152 L38 222 L56 230 L82 168Z" fill="${coat}" ${STROKE}/><path d="M134 152 L162 222 L144 230 L118 168Z" fill="${coat}" ${STROKE}/>`;
  s+=`<circle cx="47" cy="234" r="11" fill="${skin}" ${STROKE}/><circle cx="153" cy="234" r="11" fill="${skin}" ${STROKE}/>`;
  s+=`<path d="M64 146 Q100 132 136 146 L158 246 Q100 258 42 246 Z" fill="${coat}" ${STROKE}/><path d="M100 140 V250" stroke="#333" stroke-width="2"/>`;
  [172,198,224].forEach(y=>s+=`<circle cx="108" cy="${y}" r="4.5" fill="#fff" ${STROKE}/>`);
  s+=`<circle cx="100" cy="98" r="50" fill="${skin}" ${STROKE}/>`;
  if(o.girl)s+=`<path d="M54 88 Q100 66 146 88 L148 106 Q132 92 118 100 Q100 88 82 100 Q68 92 52 106Z" fill="${hair}" ${STROKE}/>`;
  else{for(let x=58;x<=142;x+=12)s+=`<circle cx="${x}" cy="${86+Math.abs(x-100)*0.12}" r="10" fill="${hair}"/>`}
  s+=`<path d="M58 72 Q100 16 142 72 Z" fill="${coat}" ${STROKE}/><path d="M32 84 Q100 58 168 84 Q174 92 160 93 Q100 74 40 93 Q26 92 32 84Z" fill="${coat}" ${STROKE}/>`;
  s+=`<ellipse cx="82" cy="112" rx="8" ry="9" fill="#fff" ${STROKE}/><ellipse cx="118" cy="112" rx="8" ry="9" fill="#fff" ${STROKE}/><circle cx="83" cy="114" r="5" fill="#3E2723"/><circle cx="119" cy="114" r="5" fill="#3E2723"/><circle cx="85" cy="112" r="1.8" fill="#fff"/><circle cx="121" cy="112" r="1.8" fill="#fff"/>`;
  s+=`<circle cx="70" cy="128" r="7" fill="#F06292" opacity=".45"/><circle cx="130" cy="128" r="7" fill="#F06292" opacity=".45"/><path d="M88 131 Q100 143 112 131" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>`;
  if(o.drop)s+=`<rect data-drop="${o.drop}" x="0" y="0" width="200" height="340" fill="rgba(0,0,0,0)"/>`;
  return s+`</svg>`}

const ITEMS={
 umbrella:{w:'rain',svg:`<svg viewBox="0 0 100 100"><path d="M6 50 Q50 -2 94 50 Q83 42 72 50 Q61 42 50 50 Q39 42 28 50 Q17 42 6 50Z" fill="#1E88E5" ${STROKE}/><path d="M28 50 Q36 18 50 10 M72 50 Q64 18 50 10" fill="none" stroke="#0D47A1" stroke-width="2"/><path d="M50 50 V84 q0 9 -9 9 q-9 0 -9 -9" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/><path d="M50 10 V3" stroke="#333" stroke-width="4" stroke-linecap="round"/></svg>`},
 raincoat:{w:'rain',svg:`<svg viewBox="0 0 100 100"><path d="M32 12 Q50 6 68 12 L90 40 L79 50 L72 42 L76 94 H24 L28 42 L21 50 L10 40 Z" fill="#FDD835" ${STROKE}/><path d="M50 12 V94" stroke="#333" stroke-width="2.5"/><circle cx="57" cy="34" r="3.5" fill="#333"/><circle cx="57" cy="54" r="3.5" fill="#333"/><circle cx="57" cy="74" r="3.5" fill="#333"/><path d="M36 12 L50 28 L64 12" fill="none" stroke="#333" stroke-width="2.5"/></svg>`},

 sunglasses:{w:'sun',svg:`<svg viewBox="0 0 100 100"><path d="M8 42 Q50 34 92 42" fill="none" stroke="#333" stroke-width="4"/><circle cx="29" cy="54" r="18" fill="#37474F" stroke="#E91E63" stroke-width="5"/><circle cx="71" cy="54" r="18" fill="#37474F" stroke="#E91E63" stroke-width="5"/><path d="M47 50 Q50 45 53 50" stroke="#E91E63" stroke-width="5" fill="none"/><path d="M20 47 l9 -5" stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round"/><path d="M62 47 l9 -5" stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round"/></svg>`},
 'sun hat':{w:'sun',svg:`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="64" rx="46" ry="15" fill="#F5D58A" ${STROKE}/><path d="M27 62 Q28 26 50 26 Q72 26 73 62Z" fill="#F5D58A" ${STROKE}/><path d="M28 52 Q50 58 72 52 L72 60 Q50 66 28 60Z" fill="#E91E63"/><circle cx="66" cy="54" r="7" fill="#FF80AB" ${STROKE}/></svg>`},
 sandals:{w:'sun',svg:`<svg viewBox="0 0 100 100"><ellipse cx="30" cy="54" rx="16" ry="36" fill="#F48FB1" ${STROKE}/><path d="M16 38 Q30 28 44 38" stroke="#C2185B" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M16 62 Q30 54 44 62" stroke="#C2185B" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="70" cy="54" rx="16" ry="36" fill="#F48FB1" ${STROKE}/><path d="M56 38 Q70 28 84 38" stroke="#C2185B" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M56 62 Q70 54 84 62" stroke="#C2185B" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`}
};
function cloudSVG(fill='#ECEFF1'){return `<svg viewBox="0 0 160 90"><path d="M30 80 Q4 80 6 60 Q8 40 32 42 Q34 14 64 14 Q88 14 96 34 Q108 22 124 30 Q140 38 136 52 Q156 54 154 68 Q152 80 136 80 Z" fill="${fill}" stroke="#78909C" stroke-width="4" stroke-linejoin="round"/></svg>`}
function sunSVG(rays=12){let s=`<svg viewBox="0 0 120 120">`;for(let i=0;i<rays;i++){const a=i*2*Math.PI/rays;s+=`<line x1="${60+40*Math.cos(a)}" y1="${60+40*Math.sin(a)}" x2="${60+56*Math.cos(a)}" y2="${60+56*Math.sin(a)}" stroke="#FFB300" stroke-width="7" stroke-linecap="round"/>`}return s+`<circle cx="60" cy="60" r="32" fill="#FFD54F" stroke="#FFA000" stroke-width="4"/><circle cx="50" cy="56" r="4" fill="#5D4037"/><circle cx="70" cy="56" r="4" fill="#5D4037"/><path d="M48 68 Q60 78 72 68" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/></svg>`}
function balloonSVG(c){const f=COL[c];return `<svg viewBox="0 0 60 104"><path d="M30 68 q-9 12 0 24 q7 8 0 12" stroke="#666" fill="none" stroke-width="2.5"/><path d="M25 62 l5 7 l5 -7z" fill="${f}" stroke="#333" stroke-width="2"/><ellipse cx="30" cy="33" rx="26" ry="30" fill="${f}" stroke="#333" stroke-width="2.5"/><ellipse cx="20" cy="22" rx="6" ry="10" fill="#fff" opacity=".5"/></svg>`}

/* bear in a raincoat — colouring page (parts: hat, coat, boots, umbrella) */
function bearSVG(hints){
  const h=(x,y,c)=>hints?`<path d="M${x-9} ${y} q4 -9 10 -6 q8 -3 8 6 q2 8 -8 9 q-10 1 -10 -9z" fill="${COL[c]}" pointer-events="none"/>`:'';
  return `<svg viewBox="0 0 300 380">

  ${h(122,290,'blue')}
  <circle cx="93" cy="296" r="11" fill="#8D6E63" ${STROKE}/><circle cx="163" cy="200" r="11" fill="#8D6E63" ${STROKE}/>
  <circle cx="150" cy="182" r="42" fill="#8D6E63" ${STROKE}/>

  <circle cx="126" cy="194" r="6" fill="#F06292" opacity=".4"/><circle cx="174" cy="194" r="6" fill="#F06292" opacity=".4"/>
  <path data-part="hat" d="M108 156 Q150 98 192 156 Z" fill="#fff" ${STROKE}/>
  <path data-part="hat" d="M90 166 Q150 140 210 166 Q216 174 202 175 Q150 158 98 175 Q84 174 90 166Z" fill="#fff" ${STROKE}/>
  ${h(150,138,'green')}

/* faces */
const FACE_FEAT={
 eyes:`<g data-hit="eyes"><rect x="52" y="82" width="96" height="38" fill="rgba(0,0,0,0)"/><ellipse cx="75" cy="100" rx="12" ry="14" fill="#fff" ${STROKE}/><ellipse cx="125" cy="100" rx="12" ry="14" fill="#fff" ${STROKE}/><circle cx="76" cy="103" r="7.5" fill="#42A5F5"/><circle cx="126" cy="103" r="7.5" fill="#42A5F5"/><circle cx="76" cy="103" r="3.8" fill="#111"/><circle cx="126" cy="103" r="3.8" fill="#111"/><circle cx="79" cy="99" r="2.4" fill="#fff"/><circle cx="129" cy="99" r="2.4" fill="#fff"/></g>`,
 nose:`<g data-hit="nose"><circle cx="100" cy="126" r="17" fill="rgba(0,0,0,0)"/><path d="M88 119 H112 L100 136 Z" fill="#8D5A3B" stroke="#4E342E" stroke-width="3" stroke-linejoin="round"/></g>`,
 mouth:`<g data-hit="mouth"><rect x="68" y="140" width="64" height="34" fill="rgba(0,0,0,0)"/><path d="M74 148 Q100 184 126 148 Q100 162 74 148Z" fill="#E57373" ${STROKE}/></g>`
};
const FEAT_VB={eyes:'50 80 100 42',nose:'82 114 36 26',mouth:'68 142 64 34'};
const FACE_GHOST={eyes:`<g opacity=".5" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="6 6"><ellipse cx="75" cy="100" rx="12" ry="14"/><ellipse cx="125" cy="100" rx="12" ry="14"/></g>`,nose:`<path d="M88 119 H112 L100 136 Z" fill="none" stroke="#555" opacity=".5" stroke-width="3" stroke-dasharray="6 6"/>`,mouth:`<path d="M74 148 Q100 184 126 148 Q100 162 74 148Z" fill="none" stroke="#555" opacity=".5" stroke-width="3" stroke-dasharray="6 6"/>`};
function faceSVG(kind,feats,ghost,drop){
  let s=`<svg viewBox="0 0 200 200">`;
  if(kind==='girl'){s+=`<g data-hit="hair"><circle cx="100" cy="100" r="80" fill="#F6C343" ${STROKE}/><ellipse cx="22" cy="138" rx="16" ry="26" fill="#F6C343" ${STROKE}/><ellipse cx="178" cy="138" rx="16" ry="26" fill="#F6C343" ${STROKE}/></g>`}
  if(kind==='bear')s+=`<g data-hit="ears"><circle cx="46" cy="50" r="24" fill="#8D6E63" ${STROKE}/><circle cx="154" cy="50" r="24" fill="#8D6E63" ${STROKE}/><circle cx="46" cy="50" r="12" fill="#D7B899"/><circle cx="154" cy="50" r="12" fill="#D7B899"/></g>`;
  if(kind==='boy')s+=`<g data-hit="ears"><circle cx="32" cy="112" r="14" fill="#C68A5C" ${STROKE}/><circle cx="168" cy="112" r="14" fill="#C68A5C" ${STROKE}/></g>`;
  const skin={boy:'#C68A5C',girl:'#F9D4BC',bear:'#8D6E63'}[kind];

/* ================= pick / drag-drop system ================= */
const DND={sel:null};
function select(p){if(DND.sel)DND.sel.classList.remove('sel');DND.sel=p;if(p){p.classList.add('sel');sfx.tap()}}
function piece(node,data,onDrop,opts={}){
  node.classList.add('piece');node._data=data;node._onDrop=onDrop;node._sticky=!!opts.sticky;
  let sx=0,sy=0,drag=false,pid=null;
  const findDrop=(x,y)=>{node.style.visibility='hidden';const t=document.elementFromPoint(x,y);node.style.visibility='';return t&&t.closest('[data-drop]')};
  node.addEventListener('pointerdown',e=>{if(node.classList.contains('used'))return;e.preventDefault();ac();pid=e.pointerId;try{node.setPointerCapture(pid)}catch(_){}sx=e.clientX;sy=e.clientY;drag=false});
  node.addEventListener('pointermove',e=>{if(pid!==e.pointerId)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag&&Math.hypot(dx,dy)>12){drag=true;node.classList.add('dragging');if(DND.sel&&DND.sel!==node)select(null)}if(drag)node.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`});
  const end=(e,cancel)=>{if(pid!==e.pointerId)return;pid=null;if(drag){node.classList.remove('dragging');node.style.transform='';const d=cancel?null:findDrop(e.clientX,e.clientY);if(d)tryDrop(node,d)}else if(!cancel){if(opts.onTap)opts.onTap(node);select(DND.sel===node&&!node._sticky?null:node)}drag=false};
  node.addEventListener('pointerup',e=>end(e,false));
  node.addEventListener('pointercancel',e=>end(e,true));
  return node}
function tryDrop(p,d){const ok=p._onDrop(d,p);if(!ok){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}if(!(ok&&p._sticky)&&!(p._sticky&&DND.sel===p))select(null);if(p._sticky&&!DND.sel)select(p)}
stage.addEventListener('click',e=>{const d=e.target.closest&&e.target.closest('[data-drop]');if(d&&DND.sel)tryDrop(DND.sel,d)});

function dragGame(A,o){
  A.area.innerHTML=`<div style="flex:1;display:flex;flex-direction:${o.trayRight?'row':'column'};gap:1.4vh 1.6vw;min-height:0"><div class="panel scene" style="flex:1;${o.sceneStyle||''}">${o.scene}</div><div class="tray" style="${o.trayRight?'flex-direction:column;width:min(20vw,26vh);':''}${o.trayStyle||''}"></div></div>`;
  const tray=$('.tray',A.area),scene=$('.scene',A.area);
  let i=0,done=0;const total=o.free?o.tray.length:o.steps.length;
  (o.noShuffle?o.tray:shuffle(o.tray)).forEach(t=>{const s=el(`<div class="sticker" style="width:${t.w||'min(11vw,15vh)'};${t.css||''}">${t.svg}${t.label?`<div class="lbl">${t.label}</div>`:''}</div>`);piece(s,t.id,onDrop,{onTap:()=>{if(t.say||t.label)say(t.say||t.label)}});tray.appendChild(s)});
  function onDrop(d,p){if(!d.dataset.k||d.dataset.filled)return false;
    if(o.free){if(d.dataset.k!==p._data){sfx.bad();say(o.wrong?o.wrong(p._data,d.dataset.k):'Try again!');return false}}
    else{const st=o.steps[i];if(!st)return false;if(p._data!==st.want){sfx.bad();say(st.wrongPiece||`Find the ${st.want}!`);return false}if(st.at&&d.dataset.k!==st.at){sfx.bad();say(st.wrongSpot||'Not there. Try again!');return false}}
    if(!o.multi)d.dataset.filled=1;p.classList.add('used');sfx.good();
    const t=o.tray.find(x=>x.id===p._data);if(o.place)o.place(d,p._data,t,p);else d.innerHTML=t.svg;
    sparkEl(d);done++;A.dots(total,done);
    const msg=o.free?(o.praise&&o.praise(p._data,d)):o.steps[i].praise;if(msg)say(msg);
    if(!o.free)i++;
    if(done>=total)later(()=>o.onComplete?o.onComplete(scene,tray):A.finish(o.finish),1700);else if(!o.free)later(ask,1600);
    return true}
  function ask(){const st=o.steps[i];A.prompt(st.prompt,st.spoken)}
  A.dots(total,0);if(o.free)A.prompt(o.prompt,o.spoken);else ask();
  return {scene,tray}}

function paintPhase(A,root,o,potHost,onDone){
  potHost.innerHTML='';
  COLS.forEach(c=>{const p=el(`<div class="pot" style="background:${COL[c]}"></div>`);piece(p,c,drop,{sticky:true,onTap:()=>say(c)});potHost.appendChild(p)});
  $$('[data-part]',root).forEach(n=>n.setAttribute('data-drop','part'));
  let q=0;const N=o.plan.length,name=p=>(o.names&&o.names[p])||p;
  function ask(){const [p,c,h,sp]=o.plan[q];A.prompt(h||`Colour the <b>${name(p)}</b> ${cw(c)}.`,sp)}
  function drop(d,pt){const t=o.plan[q];if(!t)return false;const part=d.dataset.part;
    if(part!==t[0]){sfx.bad();say(o.wrongPart?o.wrongPart(part,t):`Find the ${name(t[0])}!`);return false}
    if(pt._data!==t[1]){sfx.bad();say(`That's ${pt._data}. Find ${t[1]}!`);return false}
    sfx.paint();$$(`[data-part="${t[0]}"]`,root).forEach(n=>{n.setAttribute('fill',COL[t[1]]);n.removeAttribute('data-drop')});sparkEl(d);
    later(()=>{sfx.good();say(t[4]||`${t[1]}!`)},250);q++;if(o.dots)o.dots(q);
    later(()=>{if(q<N)ask();else{select(null);onDone()}},1700);return true}
  ask()}

function listenFind(A,o){
  const keys=o.items.map(i=>i.k),R=o.rounds||6;let seq=[];while(seq.length<R)seq=seq.concat(shuffle(keys));seq=seq.slice(0,R);let q=0;
  function round(){A.dots(R,q);const k=seq[q];let busy=false;
    A.area.innerHTML=`<div class="panel" style="flex:1;padding:2vh 2vw"><div class="lf" style="display:grid;grid-template-columns:repeat(${o.items.length},1fr);gap:2vw;width:100%;height:100%;align-items:center"></div></div>`;
    const g=$('.lf',A.area);
    shuffle(o.items).forEach(it=>{const c=el(`<div class="sticker choice" style="display:flex;flex-direction:column;align-items:center;padding:2vh 1vw"><div style="width:100%;max-height:40vh">${it.svg}</div>${o.labels===false?'':`<div class="lbl">${it.label||it.k}</div>`}</div>`);
      c.onclick=()=>{if(busy)return;if(it.k===k){busy=true;sfx.good();c.classList.add('hl');sparkEl(c);say(o.praise(k));q++;A.dots(R,q);later(()=>q<R?round():A.finish(o.finish),2100)}else{sfx.bad();c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),500);say(o.wrong?o.wrong(it.k,k):`That's the ${it.k}. Try again!`)}};g.appendChild(c)});
    const [h,sp]=o.ask(k);A.prompt(h,sp)}
  round()}

function pathGame(A,o){
  const n=o.L.length,H=600,ys=o.L.map((_,i)=>H/n*(i+.5));
  let rOrder;do{rOrder=shuffle(o.R.map(r=>r.k))}while(o.L.some((l,i)=>rOrder.indexOf(o.map[l.k])===i)&&Math.random()<.9);
  const ry=k=>ys[rOrder.indexOf(k)],cols=['#E53935','#1E88E5','#43A047','#F9A825'];
  let s=`<svg viewBox="0 0 1000 ${H}" style="width:100%;height:100%">`,hl='';
  o.L.forEach((l,i)=>{const a=ys[i],b=ry(o.map[l.k]),m=(a+b)/2+(i%2?55:-55);const d=`M190 ${a} C 330 ${a}, 340 ${m}, 500 ${m} S 670 ${b}, 810 ${b}`;
    s+=`<path d="${d}" fill="none" stroke="${o.road||'#64B5F6'}" stroke-width="30" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>`;

    items:[L('dad','Daddy lion'),L('mum','Mummy lion'),L('cub','Baby lion',1),L('cub','Baby lion',1),D('#2E7D32','#ECEFF1','#90A4AE','Daddy duck'),D('#8D6E63','#A1887F','#6D4C41','Mummy duck'),D('#FFEB3B','#FFEB3B','#FBC02D','Baby duck',1),D('#FFEB3B','#FFEB3B','#FBC02D','Baby duck',1)],
    ask:it=>`<b>${it.label}!</b> Lion family or duck family?`,praise:it=>`Yes! ${it.label}!`,wrong:it=>`Hmm. ${it.label}. Try the other family!`,finish:'Happy families!'})}};
ACTS.findFamily={lesson:'Lesson 6',name:'Find the Family',book:'Match.',art:()=>personSVG({size:'kid',skin:'#FAD7C0',hair:'#F6C343',style:'long',shirt:'#FDD835',skirt:true,bottom:'#E53935'}),
run(A){const fams=[{p:{skin:'#8D5524',hair:'#1a1a1a',style:'short',shirt:'#42A5F5',bottom:'#263238'},c:{size:'kid',skin:'#8D5524',hair:'#1a1a1a',style:'short',shirt:'#42A5F5',bottom:'#283593'},t:'Daddy'},
   {p:{skin:'#FAD7C0',hair:'#F6C343',style:'long',shirt:'#FDD835',skirt:true,bottom:'#fff'},c:{size:'kid',skin:'#FAD7C0',hair:'#F6C343',style:'long',shirt:'#FDD835',skirt:true,bottom:'#E53935'},t:'Mummy'},
   {p:{skin:'#E0AC69',hair:'#1a1a1a',style:'long',shirt:'#EC407A',skirt:true,bottom:'#37474F'},c:{size:'kid',skin:'#E0AC69',hair:'#1a1a1a',style:'buns',shirt:'#EC407A',skirt:true,bottom:'#F8BBD0'},t:'Mummy'},
   {p:{skin:'#F1C9A5',hair:'#3E2723',style:'spiky',shirt:'#66BB6A',bottom:'#5D4037'},c:{size:'kid',skin:'#F1C9A5',hair:'#3E2723',style:'spiky',shirt:'#66BB6A',bottom:'#6D4C41'},t:'Daddy'}];
  const order=shuffle([0,1,2,3]);
  const scene=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1.5vw;width:100%;height:100%;padding:1.5vh">${order.map(i=>`<div data-drop="t" data-k="f${i}" style="display:flex;align-items:flex-end;justify-content:center;gap:4px;border-radius:20px;background:#F1F8E9;border:4px dashed #AED581;padding:1vh;min-height:0"><div style="height:95%;pointer-events:none">${personSVG(fams[i].p).replace('<svg','<svg style="height:100%;width:auto"')}</div></div>`).join('')}</div>`;
  dragGame(A,{scene,free:true,tray:fams.map((f,i)=>({id:'f'+i,svg:personSVG(f.c),w:'min(7vw,11vh)'})),
    place:(d,id,t)=>{d.insertAdjacentHTML('beforeend',`<div style="height:66%;pointer-events:none">${t.svg.replace('<svg','<svg style="height:100%;width:auto"')}</div>`);d.style.borderStyle='solid'},
    prompt:'Find the family! Drag each child to Mummy or Daddy.',praise:id=>`${fams[+id.slice(1)].t} and me! My family!`,wrong:()=>'Look again! Same hair, same T-shirt?',finish:'Happy families!'})}};

ACTS.xmasTrees={lesson:'Lesson 1',name:'Snowy Trees',book:'Stick on the star. Trace and colour the trees.',art:()=>`<svg viewBox="0 0 100 110"><polygon points="${treePts(50,14,90,80)}" fill="#fff" stroke="#333" stroke-width="3" stroke-dasharray="3 5"/><polygon points="${starPts(50,14,13,6)}" fill="#FFD54F" stroke="#E65100" stroke-width="2.5"/></svg>`,
run(A){const tree=(id,cx)=>`<polygon data-part="${id}" points="${treePts(cx,70,300,240)}" fill="#fff" stroke="#555" stroke-width="4" stroke-dasharray="3 7" stroke-linejoin="round"/><rect x="${cx-14}" y="370" width="28" height="30" fill="#6D4C41"/><g data-drop="t" data-k="star"><circle cx="${cx}" cy="64" r="44" fill="rgba(0,0,0,0)"/><polygon points="${starPts(cx,64,34,15)}" fill="rgba(255,255,255,.6)" stroke="#E65100" stroke-width="3" stroke-dasharray="6 5" stroke-linejoin="round"/></g>`;
  const scene=`<svg viewBox="0 0 800 420" style="width:100%;height:100%"><rect width="800" height="420" fill="#BBDEFB"/><path d="M0 330 Q200 300 400 330 T800 320 V420 H0Z" fill="#fff"/>${Array.from({length:30},(_,i)=>`<circle cx="${(i*97)%800}" cy="${(i*53)%300}" r="${3+i%3}" fill="#fff"/>`).join('')}${tree('big tree',230)}${tree('little tree',570)}</svg>`;
  const star=`<svg viewBox="0 0 100 100"><polygon points="${starPts(50,52,46,20)}" fill="#FFD54F" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/></svg>`;
  dragGame(A,{scene,sceneStyle:'padding:0;overflow:hidden',free:true,trayRight:true,tray:[{id:'star',svg:star,say:'star'},{id:'star',svg:star,say:'star'}].map(t=>({...t,w:'min(10vw,14vh)'})),
    place:d=>{const p=$('polygon',d);p.setAttribute('fill','#FFD54F');p.removeAttribute('stroke-dasharray');sfx.win()},prompt:'Put a <b>star</b> on top of each tree.',spoken:'Put a star on top of each tree!',praise:()=>'Twinkle, twinkle! A little star!',
    onComplete:(sc,tray)=>{paintPhase(A,sc,{plan:[['big tree','green',null,null,'A green tree!'],['little tree','green',null,null,'A green tree!']]},tray,()=>A.finish('Happy Christmas!'))}})}};
ACTS.xmasCard={lesson:'Lesson 2',name:'Christmas Card',book:'Colour the tree and the star. Make a Christmas card.',art:()=>`<svg viewBox="0 0 100 110"><rect x="4" y="4" width="92" height="102" rx="8" fill="#fff" stroke="#8E24AA" stroke-width="4"/><polygon points="${treePts(50,24,70,62)}" fill="#43A047" stroke="#333" stroke-width="2.5"/><polygon points="${starPts(50,24,11,5)}" fill="#FFD54F" stroke="#333" stroke-width="2"/></svg>`,
run(A){const s=`<svg viewBox="0 0 500 420"><rect x="40" y="10" width="420" height="400" rx="20" fill="#fff" stroke="#8E24AA" stroke-width="6"/><text x="250" y="62" text-anchor="middle" font-family="Fredoka" font-weight="600" font-size="40" fill="#E53935">Happy Christmas</text><polygon data-part="tree" points="${treePts(250,110,260,250)}" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/><rect x="236" y="370" width="28" height="26" fill="#6D4C41" stroke="#333" stroke-width="3"/><polygon data-part="star" points="${starPts(250,112,36,15)}" fill="#fff" stroke="#333" stroke-width="4" stroke-linejoin="round"/><g class="balls"></g></svg>`;
  paintGame(A,{svg:s,extra:4,plan:[['tree','green',null,null,'A green Christmas tree!'],['star','yellow',null,null,'A yellow star! Twinkle with me!']],
    after:pic=>{const sv=$('svg',pic),balls=$('.balls',sv);let n=0;const bc=['#E53935','#1E88E5','#E53935','#1E88E5'];
      A.prompt('Tap the tree! Put on <b>4</b> balls.','Tap the tree. Put on four balls!');
      sv.addEventListener('click',e=>{if(n>=4)return;const t=e.target.closest('[data-part="tree"]');if(!t)return;const pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(sv.getScreenCTM().inverse());
        balls.insertAdjacentHTML('beforeend',`<circle cx="${p.x}" cy="${p.y}" r="13" fill="${bc[n]}" stroke="#333" stroke-width="3"/><circle cx="${p.x-4}" cy="${p.y-4}" r="3.5" fill="#fff" opacity=".7"/>`);n++;sfx.pop();say(NUMW[n]+'!');A.dots(6,2+n);
        if(n===4)later(()=>{say('Happy Christmas!');A.finish('Happy Christmas!')},900)})}})}};
ACTS.springGarden={lesson:'Lesson 1',name:'Spring Garden',book:'Stick on the flowers. Colour.',art:()=>flowerSVG('#EC407A'),
run(A){const xs=[130,300,470,640];
  let s=`<svg viewBox="0 0 780 440" style="width:100%;height:100%"><rect width="780" height="440" fill="#B3E5FC"/><path d="M0 150 Q390 90 780 150 V440 H0Z" fill="#7CB342"/>`;
  s+=`<g transform="translate(590,30)"><g class="tap" data-tap="rabbit" style="transform-box:fill-box;transform-origin:bottom">${nest(PETS.rabbit,0,0,150,130)}</g></g><g transform="translate(10,20)"><ellipse cx="70" cy="110" rx="60" ry="20" fill="#8D6E63"/><g class="tap" data-tap="bird" style="transform-box:fill-box;transform-origin:bottom">${nest(PETS.bird,10,10,110,95)}</g></g>`;
  xs.forEach((x,i)=>{s+=`<path d="M${x} 420 V300" stroke="#2E7D32" stroke-width="10"/><path d="M${x} 380 Q${x-50} 350 ${x-60} 390 Q${x-20} 400 ${x} 380Z M${x} 360 Q${x+50} 330 ${x+60} 370 Q${x+20} 380 ${x} 360Z" fill="#388E3C" ${STROKE}/>`;
    s+=`<g transform="translate(${x},270)"><g class="tap" data-tap="flower" style="transform-box:fill-box;transform-origin:center">`+(i<2?`<g data-drop="t" data-k="flower"><circle r="50" fill="rgba(255,255,255,.35)" stroke="#fff" stroke-width="4" stroke-dasharray="8 7"/></g>`:petals('#fff',`flower${i}`,17,20))+`</g></g>`});
  s+='</svg>';
  dragGame(A,{scene:s,sceneStyle:'padding:0;overflow:hidden',free:true,tray:[{id:'flower',svg:flowerSVG('#E53935'),say:'flower',c:'#E53935'},{id:'flower',svg:flowerSVG('#1E88E5'),say:'flower',c:'#1E88E5'}].map(t=>({...t,w:'min(9vw,12vh)'})),
    place:(d,id,t,p)=>{d.innerHTML=petals(p.innerHTML.includes('#1E88E5')?'#1E88E5':'#E53935',null,17,20)},prompt:'Stick on the <b>flowers</b>.',spoken:'Stick on the flowers!',praise:()=>'Pop! A flower!',
    onComplete:(sc,tray)=>{paintPhase(A,sc,{plan:[['flower2','yellow',`Colour the flower ${cw('yellow')}.`],['flower3','red',`Colour the flower ${cw('red')}.`]],wrongPart:()=>'That flower is done. Find a white flower!'},tray,()=>{
      tray.innerHTML='<div class="lbl">🐰 🌸 🐦</div>';const got=new Set();A.prompt('Springtime! Tap the rabbit, the flowers and the bird!');
      const svg=$('svg',sc);svg.addEventListener('click',e=>{const g=e.target.closest('[data-tap]');if(!g)return;const k=g.dataset.tap;
        g.animate(k==='rabbit'?[{transform:'translateY(0)'},{transform:'translateY(-40px)'},{transform:'translateY(0)'},{transform:'translateY(-40px)'},{transform:'translateY(0)'}]:k==='bird'?[{transform:'rotate(0)'},{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'},{transform:'rotate(0)'}]:[{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(1)'}],{duration:k==='rabbit'?900:500});
        if(k==='rabbit'){say('The rabbits go hop! Hop! Hop! Hop!')}else if(k==='bird'){tone(1800,.08,'sine',.12);tone(2200,.08,'sine',.12,.12);say('The birds go tweet! Tweet! Tweet!')}else{sfx.pop();say('The flowers go pop! Pop!')}
        got.add(k);if(got.size===3&&!sc.dataset.end){sc.dataset.end=1;later(()=>A.finish('Springtime! Springtime!'),2200)}})})}})}};
